kind = "web"
previewPath = "/"
title = "Orbit Market"
version = "1.0.0"
id = "artifacts/orbit-market"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19425

[services.development]
run = "pnpm --filter @workspace/orbit-market run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orbit-market", "run", "build" ]
publicDir = "artifacts/orbit-market/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19425"
BASE_PATH = "/"
