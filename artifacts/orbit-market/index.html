<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Primary SEO -->
    <title>Orbit Market — Premium Global Marketplace</title>
    <meta name="description" content="Orbit Market is a multilingual premium ecommerce marketplace connecting buyers with verified vendors worldwide. Shop electronics, fashion, beauty, home &amp; more." />
    <meta name="keywords" content="orbit market, online shopping, arabic marketplace, premium products, global vendors, ecommerce, سوق أوربت" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Orbit Market" />
    <meta name="application-name" content="Orbit Market" />

    <!-- Open Graph -->
    <meta property="og:title" content="Orbit Market — Premium Global Marketplace" />
    <meta property="og:description" content="Shop premium products from verified vendors worldwide. Available in Arabic and English." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbit Market" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orbit Market — Premium Global Marketplace" />
    <meta name="twitter:description" content="Shop premium products from verified vendors worldwide." />

    <!-- Icons & PWA hints -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbit Market" />

    <!-- DNS prefetch for external image CDNs (non-blocking) -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://picsum.photos" />

    <!-- Font infrastructure — preconnect first, then stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Trimmed font weights to only what the app uses.
      display=swap: text stays visible during load (no invisible text).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Orbit Market",
      "description": "Premium global ecommerce marketplace in Arabic and English",
      "inLanguage": ["en", "ar"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "/products?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
